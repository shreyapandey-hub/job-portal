<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <title>Apply for Job</title>
    <style>
        *{
            box-sizing:border-box;

        }
        body{
            margin:0;
            font-family:Arial,sans-serif;

        }
        .apply-section{
            min-height:80vh;
            display:flex;
            flex-direction:column!important;
            align-items:center;
            padding:60px 20px;

        }
        #applyform{
            width:400px;
            display:flex !important;
            flex-direction:column !important;
            gap:15px;
            padding:30px;
            background:white;
            border-radius:10px;
            box-shadow:0 4px 15px rgba(0,0,0,0,2);


        }
        #applyform label{
            display:block !important;
            font-weight:bold;
            margin-top:8px;

        }
        #applyform input{
            display:block !important;
            width: 100% !important;
            padding:12px;
            margin-bottom:10px;

        }
        #applyform buttom{
            display:block !important;
            padding:12px;
            width:100px;
            background:#1565c0;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
    </style>
    
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <nav>
            <h2>JOB PORTAL</h2>
            <ul> 
                <li><a href="index.html"> Home</a></li>
                <li><a href="index.html#jobs">Jobs</a></li>
            </ul>
            
        
        
        
        
        </nav>
    </header>
    <section class="apply-section"> 
        <h1> Apply for a Job</h1>
        <form id="applyform">
            <label> Full Name</label>
            <input type="text" placeholder="Enter your name" required>
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>
            <label>Upload Resume</label>
            <input type="file" required>

            <buttom type="submit">
                Submit Application
            </buttom>
        </form>
        <p id="applymessage">

        </p>
        
    </section>


    <script >
        const form=document.getElementById('applyform');
        form.addEventListener("submit",function(event){
            event.prevenDefault();
            document.getElementById('applymessage').innerText="Application submitted sucessfully !";
            document.getElementById('applymessage').style.color="green";

            form.reset();




        });
        

      

        

    
    </script>

    
</body>
</html>
